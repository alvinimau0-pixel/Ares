<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a12"><title>ARES — Intelligence Interface</title>
<style>
:root{color-scheme:dark;--bg:#080a12;--panel:rgba(17,21,35,.78);--line:rgba(151,169,220,.15);--muted:#8993ad;--text:#eef2ff;--blue:#77aaff;--violet:#a58bff;--cyan:#83e4f5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 43%,#141b31 0%,#0b0e19 38%,#070910 78%);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.shell{height:100dvh;display:grid;grid-template-rows:72px 1fr 74px;max-width:1600px;margin:auto;padding:0 34px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;letter-spacing:.22em;font-size:12px;font-weight:650}.brandmark{width:28px;height:28px;border:1px solid #7899e9;border-radius:50%;display:grid;place-items:center;color:#a9c5ff;box-shadow:0 0 20px #759dff40}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.18em;font-weight:400;margin-top:2px}
.topright{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:11px}.status{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#75dfb1;box-shadow:0 0 10px #75dfb1}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#ffffff06;display:grid;place-items:center;color:#bdc8e4;transition:.2s}.iconbtn:hover,.iconbtn.active{border-color:#91aaff88;background:#9bb8ff16;color:white}
main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.eyebrow{font-size:10px;letter-spacing:.28em;color:#9aa9cb;text-transform:uppercase;margin-bottom:8px}.greeting{font-size:clamp(24px,3vw,36px);font-weight:350;letter-spacing:-.04em;margin:0}.sub{color:var(--muted);font-size:13px;margin:8px 0 0}
.orb-wrap{width:min(48vh,410px);height:min(48vh,410px);min-width:260px;min-height:260px;position:relative;margin:14px 0 2px;display:grid;place-items:center;cursor:pointer;outline:none}
.orb-wrap:before,.orb-wrap:after{content:"";position:absolute;inset:7%;border-radius:50%;border:1px solid #8eb5ff22;box-shadow:0 0 70px #5d7cff13,inset 0 0 50px #7d8eff0a;animation:orbit 26s linear infinite}
.orb-wrap:after{inset:1%;border-color:#b3a2ff18;transform:rotateX(70deg);animation-duration:34s}
.orb{width:69%;height:69%;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 34% 27%,#e5edff 0,#9cbcff 4%,#637ff1 14%,#3d43a0 33%,#191c48 57%,#0b1024 73%);box-shadow:0 0 25px #789fff88,0 0 85px #5d72ff55,0 0 160px #6255d52a,inset -18px -24px 50px #050716,inset 8px 8px 28px #e4f0ff55;animation:breathe 6s ease-in-out infinite}
.orb:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent 0 16%,#a9d7ff65 22%,transparent 31% 48%,#a88aff66 56%,transparent 67% 83%,#85dffb55 91%,transparent);filter:blur(16px);animation:spin 18s linear infinite}
.orb:after{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(ellipse at 40% 27%,#e7f3ff66,transparent 28%),radial-gradient(ellipse at 60% 80%,#8d77ff44,transparent 52%);filter:blur(12px)}
.orb-core{position:absolute;z-index:2;width:15%;height:15%;border-radius:50%;background:#e6f1ff;filter:blur(14px);opacity:.65;box-shadow:0 0 36px 22px #9cbfff66}
.orb-wrap.listening .orb{box-shadow:0 0 35px #89e9ffbb,0 0 120px #69caff88,0 0 180px #6255d555;animation:breathe 1.2s ease-in-out infinite}
.orb-wrap.thinking .orb{animation:spin 3s linear infinite,breathe 2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045);filter:saturate(1.2) brightness(1.13)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotate(360deg)}}
.orb-label{font-size:10px;letter-spacing:.24em;color:#b9c6e4;margin-top:5px;text-transform:uppercase}
.prompt{width:min(570px,90%);height:54px;border:1px solid #9eb5e92b;background:#0e1322b8;border-radius:28px;display:flex;align-items:center;padding:6px 8px 6px 20px;gap:10px;box-shadow:0 12px 45px #0004;backdrop-filter:blur(18px);margin-top:20px}
.prompt input{flex:1;min-width:0;background:none;border:0;outline:0;color:white;font-size:13px}.prompt input::placeholder{color:#77829e}
.send{border:0;border-radius:50%;width:38px;height:38px;background:linear-gradient(135deg,#83b7ff,#9a83ff);color:#101529;font-size:18px}
.quick{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:16px}.chip{border:1px solid var(--line);background:#ffffff05;border-radius:20px;padding:7px 13px;color:#aab5d0;font-size:11px;transition:.2s}.chip:hover{background:#9cb8ff14;border-color:#8baaff55;color:white}
.bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.08em}.modules{display:flex;gap:8px}.module{display:flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:22px;background:none;color:#9aa6c1;padding:9px 12px;font-size:11px}.module:hover,.module.active{border-color:var(--line);background:#ffffff08;color:#edf2ff}.module span{font-size:14px;color:#a8bdff}
.panel{position:fixed;z-index:10;right:26px;top:88px;width:min(430px,calc(100vw - 32px));max-height:calc(100dvh - 120px);overflow:auto;border:1px solid #9bb2e52b;background:rgba(12,16,28,.94);backdrop-filter:blur(24px);border-radius:20px;padding:22px;box-shadow:0 24px 90px #0009;display:none}.panel.open{display:block;animation:rise .22s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{font-size:17px;font-weight:500;margin:0}.panel p{color:var(--muted);font-size:12px}.close{background:none;border:0;color:#9aa7c5;font-size:22px}
.card{border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;background:#ffffff04}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row strong{font-size:12px;font-weight:550}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.action{border:1px solid #8daaff55;background:#8eaaff16;border-radius:20px;padding:7px 12px;font-size:11px;color:#dce6ff}.action:hover{background:#8eaaff2b}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:#9aa7c5;letter-spacing:.1em;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#080d19;border-radius:9px;padding:10px 11px;outline:0;font-size:12px}.field textarea{min-height:70px;resize:vertical}.note{font-size:10px!important;color:#8995b1!important;line-height:1.6}.pill{font-size:9px;color:#91a9dc;border:1px solid #8baaff44;border-radius:20px;padding:4px 8px}
.workflow{position:relative;display:grid;gap:10px}.node{border:1px solid #8299ce38;border-radius:11px;padding:12px;background:#121a2d;display:flex;align-items:center;gap:10px}.node b{font-size:11px;font-weight:500}.node small{display:block;color:var(--muted);font-size:9px}.node i{width:27px;height:27px;border-radius:8px;background:#829fff18;display:grid;place-items:center;color:#a9c3ff;font-style:normal}.connector{height:12px;width:1px;background:#7f9ce977;margin:-10px 0 -10px 25px}
.toast{position:fixed;z-index:30;bottom:88px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#1b2740;border:1px solid #8faeff44;color:#e9efff;padding:10px 16px;border-radius:24px;font-size:11px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:680px){.shell{padding:0 16px;grid-template-rows:62px 1fr 72px}.topright .status,.topright .clock{display:none}.orb-wrap{width:min(43vh,340px);height:min(43vh,340px);min-width:230px;min-height:230px}.bottom{justify-content:center}.bottom>span{display:none}.modules{gap:2px;justify-content:space-between;width:100%}.module{padding:9px 8px;flex-direction:column;gap:3px;font-size:9px}.panel{top:72px;right:12px;max-height:calc(100dvh - 92px)}.greeting{font-size:27px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
 <div class="brand"><div class="brandmark">A</div><div>ARES <small>PERSONAL INTELLIGENCE</small></div></div>
 <div class="topright"><div class="status"><i class="dot"></i><span id="systemStatus">SYSTEM READY</span></div><span class="clock" id="clock"></span><button class="iconbtn" data-panel="settings" aria-label="Settings">⚙</button></div>
</header>
<main>
 <div class="eyebrow">Your intelligence, connected</div><h1 class="greeting">Good evening.</h1><p class="sub">I’m here. What shall we work on?</p>
 <div class="orb-wrap" id="orb" role="button" tabindex="0" aria-label="Activate Ares">
  <div class="orb"></div><div class="orb-core"></div>
 </div>
 <div class="orb-label" id="orbLabel">ARES · STANDBY</div>
 <form class="prompt" id="promptForm"><input id="promptInput" autocomplete="off" placeholder="Ask Ares anything…" aria-label="Message Ares"><button class="send" aria-label="Send">↑</button></form>
 <div class="quick"><button class="chip" data-panel="workflows">Open workflows</button><button class="chip" data-panel="memory">Search memory</button><button class="chip" data-panel="vision">Use vision</button></div>
</main>
<footer class="bottom"><span>ARES CORE · V1.0</span><nav class="modules"><button class="module" data-panel="voice"><span>◖</span>Talk</button><button class="module" data-panel="ears"><span>⌁</span>Listen</button><button class="module" data-panel="vision"><span>◉</span>Vision</button><button class="module" data-panel="memory"><span>▤</span>Memory</button><button class="module" data-panel="workflows"><span>⌘</span>Workflows</button></nav><span>PRIVATE SESSION</span></footer>
</div>
<section class="panel" id="panel" aria-live="polite"><div class="panelhead"><h2 id="panelTitle">Module</h2><button class="close" id="closePanel" aria-label="Close">×</button></div><div id="panelBody"></div></section>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), panel=$('#panel'), body=$('#panelBody'), title=$('#panelTitle'), orb=$('#orb'), orbLabel=$('#orbLabel');
let recognition=null, cameraStream=null, active=''; const cfg=JSON.parse(localStorage.getItem('ares-config')||'{}');
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function show(name){active=name;document.querySelectorAll('.module').forEach(x=>x.classList.toggle('active',x.dataset.panel===name));panel.classList.add('open');const views={
voice:['Talk to Ares',`<div class="card"><div class="row"><div><strong>ElevenLabs voice</strong><small>Conversational voice connection</small></div><span class="pill">SETUP REQUIRED</span></div><div class="field"><label>ElevenLabs Agent ID</label><input id="agentId" placeholder="Paste your Agent ID" value="${esc(cfg.agentId||'agent_9201m66px83rf829cx5yj829qrj6')}"></div><button class="action" id="saveAgent">Save Agent ID</button><div style="margin-top:14px"><elevenlabs-convai agent-id="agent_9201m66px83rf829cx5yj829qrj6"></elevenlabs-convai></div><p class="note">Voice widget connected to your Ares agent. Configure its allowed domains in ElevenLabs before production use. Never put your ElevenLabs API key in frontend code.</p></div><div class="card"><div class="row"><div><strong>Browser speech</strong><small>Use device speech recognition and speech synthesis</small></div><button class="action" id="browserTalk">Try voice</button></div></div>`],
ears:['Listening',`<div class="card"><div class="row"><div><strong>Microphone input</strong><small>Speech recognition via your browser</small></div><span class="pill">DEVICE PERMISSION</span></div><p id="transcript" class="note">Tap start and allow microphone access. Speech recognition availability depends on your browser.</p><button class="action" id="startListen">Start listening</button> <button class="action" id="stopListen">Stop</button></div>`],
vision:['Vision',`<div class="card"><div class="row"><div><strong>Camera preview</strong><small>Local device camera access</small></div><span class="pill">LOCAL PREVIEW</span></div><video id="camera" autoplay playsinline muted style="width:100%;border-radius:10px;margin-top:12px;background:#050812;max-height:230px"></video><button class="action" id="startCamera">Enable camera</button> <button class="action" id="stopCamera">Stop camera</button><p class="note">This prototype previews camera locally. It does not upload or analyze video frames.</p></div>`],
memory:['Memory vault',`<div class="card"><div class="row"><div><strong>Obsidian connection</strong><small>Vault bridge / Local REST API</small></div><span class="pill">NOT CONNECTED</span></div><div class="field"><label>Vault bridge URL</label><input id="obsidianUrl" placeholder="https://your-bridge.example" value="${esc(cfg.obsidianUrl||'')}"></div><div class="field"><label>Vault name</label><input id="vaultName" placeholder="Ares Memory" value="${esc(cfg.vaultName||'Ares Memory')}"></div><button class="action" id="saveMemory">Save connection details</button><p class="note">A secure local bridge or authenticated API is required. No vault data is read until a bridge is connected.</p></div><div class="card"><strong>Memory areas</strong><p class="note">Identity · Projects · Decisions · Knowledge · Daily notes</p></div>`],
settings:['System settings',`<div class="card"><strong>Integration endpoints</strong><div class="field"><label>AI gateway URL</label><input id="gatewayUrl" placeholder="https://your-api.example" value="${esc(cfg.gatewayUrl||'')}"></div><div class="field"><label>n8n webhook base URL</label><input id="n8nUrl" placeholder="https://your-n8n.example" value="${esc(cfg.n8nUrl||'')}"></div><div class="field"><label>MCP gateway URL</label><input id="mcpUrl" placeholder="https://your-mcp.example" value="${esc(cfg.mcpUrl||'')}"></div><button class="action" id="saveSettings">Save endpoints</button></div><div class="card"><strong>API key policy</strong><p class="note">API keys are deliberately not stored in this browser prototype. Add secrets in Vercel Environment Variables and access them only from server-side API routes. Do not paste production secrets into public frontend settings.</p></div><div class="card"><div class="row"><div><strong>GitHub</strong><small>alvinimau0-pixel / Ares</small></div><span class="pill">SOURCE REPO</span></div><div class="row" style="margin-top:12px"><div><strong>Vercel</strong><small>Deployment target</small></div><span class="pill">PENDING LINK</span></div></div>`],
workflows:['Workflow studio',`<p>Visual automation canvas · starter flow</p><div class="workflow"><div class="node"><i>◈</i><div><b>Trigger · User request</b><small>Message received from Ares</small></div></div><div class="connector"></div><div class="node"><i>✧</i><div><b>AI Router</b><small>Classify intent and choose a skill</small></div></div><div class="connector"></div><div class="node"><i>⌘</i><div><b>Execute tool / MCP</b><small>Run approved integration</small></div></div><div class="connector"></div><div class="node"><i>✓</i><div><b>Respond + audit</b><small>Return result and record activity</small></div></div></div><div class="card"><div class="row"><div><strong>n8n automation</strong><small>Connect an existing n8n instance</small></div><span class="pill">ENDPOINT NEEDED</span></div><button class="action" id="openN8n">Open n8n</button><p class="note">This is an interface prototype, not an n8n replacement. Live workflow CRUD requires n8n API credentials on a backend.</p></div>`]
};title.textContent=views[name][0];body.innerHTML=views[name][1];wire(name)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('ares-config',JSON.stringify(cfg))}
function wire(name){
const on=(id,fn)=>{const el=$('#'+id);if(el)el.onclick=fn};
if(name==='voice'){on('saveAgent',()=>{cfg.agentId=$('#agentId').value.trim();save();toast('Agent ID saved locally')});on('browserTalk',()=>{const u=new SpeechSynthesisUtterance('Hello. Ares voice output is ready. Connect an ElevenLabs agent for live conversation.');speechSynthesis.speak(u)})}
if(name==='ears'){on('startListen',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Speech recognition is not supported in this browser');return}recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.onresult=e=>$('#transcript').textContent=Array.from(e.results).map(r=>r[0].transcript).join(' ');recognition.onerror=e=>toast('Microphone: '+e.error);recognition.start();orb.classList.add('listening');orbLabel.textContent='ARES · LISTENING';toast('Listening started')});on('stopListen',()=>{recognition?.stop();orb.classList.remove('listening');orbLabel.textContent='ARES · STANDBY';toast('Listening stopped')})}
if(name==='vision'){on('startCamera',async()=>{try{cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('#camera').srcObject=cameraStream;toast('Camera enabled locally')}catch(e){toast('Camera unavailable: '+e.message)}});on('stopCamera',()=>{cameraStream?.getTracks().forEach(t=>t.stop());cameraStream=null;$('#camera').srcObject=null;toast('Camera stopped')})}
if(name==='memory'){on('saveMemory',()=>{cfg.obsidianUrl=$('#obsidianUrl').value.trim();cfg.vaultName=$('#vaultName').value.trim();save();toast('Memory connection details saved')})}
if(name==='settings'){on('saveSettings',()=>{cfg.gatewayUrl=$('#gatewayUrl').value.trim();cfg.n8nUrl=$('#n8nUrl').value.trim();cfg.mcpUrl=$('#mcpUrl').value.trim();save();toast('Endpoints saved locally')})}
if(name==='workflows')on('openN8n',()=>{if(cfg.n8nUrl)window.open(cfg.n8nUrl,'_blank','noopener');else toast('Add your n8n URL in Settings first')})
}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.panel)));
$('#closePanel').onclick=()=>panel.classList.remove('open');
$('#orb').onclick=()=>{orb.classList.toggle('thinking');orbLabel.textContent=orb.classList.contains('thinking')?'ARES · PROCESSING':'ARES · STANDBY';setTimeout(()=>{orb.classList.remove('thinking');if(!orb.classList.contains('listening'))orbLabel.textContent='ARES · STANDBY'},2200)};
$('#orb').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#orb').click()}};
$('#promptForm').onsubmit=e=>{e.preventDefault();const v=$('#promptInput').value.trim();if(!v)return;toast('Message captured. Connect an AI gateway to enable responses.');$('#promptInput').value='';orb.classList.add('thinking');orbLabel.textContent='ARES · REQUEST RECEIVED';setTimeout(()=>{orb.classList.remove('thinking');orbLabel.textContent='ARES · STANDBY'},1800)};
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});const h=d.getHours();$('.greeting').textContent=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.'}tick();setInterval(tick,30000);
</script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>\n</body></html>
